name: CI

# PR 을 올리거나 develop·main 에 push 할 때 백엔드 테스트와 마이그레이션 누락 검사를 자동으로 돌린다.
# 배포(CD)는 하지 않는다. 서버 반영은 서버에서 deploy/deploy.sh 로 직접 한다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에서 새 push 가 오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # agent 패키지가 레포 루트에 있어서 필요하다 (서버 systemd 유닛과 같은 설정)
      PYTHONPATH: ..
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements.lock

      - name: 패키지 설치
        working-directory: .
        run: pip install -r backend/requirements.txt -r requirements.lock

      - name: 설정 점검
        run: python manage.py check

      - name: 마이그레이션 누락 검사
        run: python manage.py makemigrations --check --dry-run

      - name: 테스트
        run: python manage.py test
