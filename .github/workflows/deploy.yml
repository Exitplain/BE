name: Deploy

# 서버(EC2)에 main 브랜치를 배포한다 (운영 = main. develop 은 통합용이라 배포하지 않는다). SSH(22번 포트)는 쓰지 않고, AWS Systems Manager(SSM)로
# 서버 안에서 deploy/deploy.sh 를 실행한다. AWS 자격 증명은 장기 키가 아니라 GitHub OIDC 로 임시 발급한다.
# 실행 방법 두 가지:
#  1) 자동: main 에 push(머지)된 커밋의 CI 가 모두 성공하면 이어서 배포한다 (workflow_run).
#     PR 이나 develop 의 CI 는 배포하지 않는다. CI 가 실패하면 배포하지 않는다.
#  2) 수동: Actions 탭에서 Run workflow (workflow_dispatch). 자동 배포가 막혔을 때나 다시 배포할 때 쓴다.
# 배포하면 서버가 마이그레이션을 적용하고 exitplain-web, exitplain-worker 를 재시작한다 (몇 초간 502, 실행 중인 테스트는 중단될 수 있다).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 배포 중인 작업은 끝까지 간다

permissions:
  id-token: write   # OIDC 토큰 발급
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # main 브랜치에서만 실행한다 (AWS 역할의 신뢰 정책도 main 으로 제한한다).
    # 자동 실행(workflow_run)은 main 에 push 된 커밋의 CI 가 성공했을 때만 배포한다.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    env:
      AWS_REGION: ap-northeast-2
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 서버에서 deploy.sh 실행
        run: |
          set -euo pipefail
          # ubuntu 사용자로 실행한다 (/srv/exitplain 이 ubuntu 소유라 root 로 git 을 쓰면 소유권이 꼬인다)
          COMMAND="sudo -iu ubuntu bash -lc 'cd /srv/exitplain/BE/deploy && ./deploy.sh main'"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy main ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "commands=[\"$COMMAND\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          # 끝날 때까지 기다린다 (성공하지 않으면 wait 가 실패한다)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "상태: $STATUS"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text | tail -40
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text | tail -40
            exit 1
          fi

      - name: 배포 결과 확인 (공개 주소)
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://exitplain.store/api/v1/sample/projects || true)
            echo "시도 $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "배포 뒤 API 가 200 을 돌려주지 않습니다" && exit 1
