# /etc/nginx/sites-available/exitplain 로 복사 후 sites-enabled 에 링크한다.
# 같은 출처(same-origin)로 프런트 정적 빌드와 API를 함께 서빙한다.

server {
    listen 80 default_server;
    server_name _;            # 도메인이 생기면 server_name 을 바꾸고 certbot 으로 HTTPS 를 붙인다.

    client_max_body_size 5m;

    # Django admin·collectstatic 결과물 (settings.py 에 STATIC_ROOT=/srv/exitplain/static 필요)
    location /static/ {
        alias /srv/exitplain/static/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프런트 정적 빌드(dist/out)를 /srv/exitplain/frontend 에 복사해 둔다. SPA 라우팅 대응.
    location / {
        root /srv/exitplain/frontend;
        try_files $uri /index.html;
    }

    # 주의: artifacts(스크린샷·events.jsonl)는 여기서 직접 서빙하지 않는다.
    # 로그인한 사용자만 볼 수 있도록 Django 엔드포인트로만 내보낸다.
}
